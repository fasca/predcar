[project]
name = "predcar"
version = "0.1.0"
description = "Statistical proof of rarefaction of 1990-2015 car models in Europe from official open data"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    # Not imported by the package: kept for ad-hoc SQL over the Parquet layers
    # (CLAUDE.md stack, `docs/ARCHITECTURE.md`), which is how silver/gold get inspected.
    "duckdb>=1.1",
    "httpx>=0.27",
    "jinja2>=3.1.6",
    "markdown>=3.10.3",
    "polars>=1.10",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
predcar = "predcar.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["predcar"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "N"]

[tool.ruff.lint.per-file-ignores]
"predcar/cli.py" = ["B008"]  # typer.Option in defaults is the documented Typer style

[tool.ruff.lint.isort]
known-first-party = ["predcar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
