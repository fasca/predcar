name: Site

# Rebuilds the static site from fresh official data and deploys it to GitHub Pages:
# quarterly (after each DfT release), on demand, and on every push to main.
on:
  schedule:
    - cron: "0 6 20 1,4,7,10 *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Fetch official data (DfT, RDW)
        run: make fetch-uk fetch-nl
      - name: Pipeline raw → silver → gold
        run: make ingest-uk ingest-nl normalize score
      - name: Build site
        run: make site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
